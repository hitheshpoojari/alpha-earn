<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070B1F;--card:rgba(255,255,255,.08);--ink:#fff;--mute:rgba(255,255,255,.7);--acc:#E5334B;--onacc:#fff;--blue:#7C9BFF;--line:rgba(255,255,255,.16);--soft:rgba(255,255,255,.10);--gold:#FFC53D}

html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;background:var(--bg);background-size:cover;background-position:center}

body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
body::before{width:340px;height:340px;background:var(--blob1,#2F5BFF);left:-120px;top:-60px;filter:blur(80px);opacity:.75}

.card,.hero,.note,nav,#ov div,input{-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%)}

input{background:rgba(255,255,255,.08)}
#ov div{background:rgba(20,28,70,.85)}

.cell{aspect-ratio:1;font-size:30px;padding:0;border-radius:14px;font-weight:800}

@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(320px) rotate(540deg);opacity:0}}

.ic .fl{font-size:22px;animation:turn 3s ease-in-out infinite}
.cf{position:absolute;top:0;width:8px;height:12px;animation:fall 2.2s ease-in forwards}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}

.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{padding:9px 4px;font-size:14px;background:transparent}
.seg .e.on{background:var(--blue);color:#07102e}
.seg .m.on{background:var(--gold);color:#2a1d00}
.seg .h.on{background:var(--acc);color:var(--onacc)}
#splash{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease}
#splash .slogo svg{width:96px;height:96px;display:block;animation:logoIn .9s cubic-bezier(.2,.8,.3,1.25) both}
.sname{font-size:26px;font-weight:800;margin:0;animation:rise .6s ease-out .4s both}
.ld{width:140px;height:5px;background:var(--soft);border-radius:3px;overflow:hidden;animation:rise .6s ease-out .6s both}
.ld i{display:block;height:100%;background:var(--acc);animation:fillb 1.5s ease-in-out .5s both}
.ring{position:absolute;top:calc(50% - 34px);left:50%;width:150px;height:150px;border-radius:50%;border:2px solid var(--blue);animation:ringp 1.8s ease-out infinite}
.ring.r2{border-color:var(--acc);animation-delay:.9s}
@keyframes logoIn{0%{transform:scale(.3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fillb{from{width:0}to{width:100%}}
@keyframes ringp{0%{transform:translate(-50%,-50%) scale(.6);opacity:.8}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sd{background:var(--soft);border-radius:10px;padding:7px 0;text-align:center;border:1.5px solid transparent}
.sd small{display:block;font-size:10px;color:var(--mute)}
.sd b{font-size:12px}
.sd.done{background:rgba(124,155,255,.3)}
.sd.now{border-color:var(--gold)}
.hero{transform:perspective(900px) rotateX(3deg);box-shadow:0 24px 38px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.18) inset,0 -8px 14px rgba(0,0,0,.25) inset}
.hero .n{color:#FFE08A;text-shadow:0 1px 0 #E0A526,0 2px 0 #CE9420,0 3px 0 #B8801A,0 4px 0 #A06E15,0 5px 0 #8A5C10,0 10px 14px rgba(0,0,0,.5)}
.coin3d{width:64px;height:64px;margin:0 auto 8px;perspective:500px}
.coin3d span{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFF4B8,#FFC53D 48%,#B7791F);color:#7A4B00;font-weight:800;font-size:28px;box-shadow:0 0 0 4px #E0A526,0 0 0 7px #A8701A,0 12px 20px rgba(0,0,0,.5);animation:spinY 3.4s linear infinite}
@keyframes spinY{to{transform:rotateY(360deg)}}
.dot{background:radial-gradient(circle at 32% 28%,#FFF4B8,#FFC53D 55%,#B7791F);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.chip{box-shadow:0 6px 12px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.2) inset}
button:disabled{opacity:.55;cursor:not-allowed}
.wfc{aspect-ratio:1;padding:0;font-size:15px;font-weight:800;border-radius:8px;background:var(--soft);color:var(--ink)}
.wfc.fnd{background:rgba(124,155,255,.38);color:#fff}
.wfc.sl{background:var(--gold);color:#2a1d00}
.wfg{touch-action:none;user-select:none;-webkit-user-select:none}
#gift{position:fixed;inset:0;background:rgba(5,8,25,.9);display:none;align-items:center;justify-content:center;z-index:50;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#mt{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.spn{width:54px;height:54px;border-radius:50%;border:5px solid var(--soft);border-top-color:var(--acc);animation:rot 1s linear infinite}
.gwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:260px}
.gbx{position:relative;z-index:1;width:130px;height:130px;margin-top:20px;animation:gshake .55s ease-in-out 0s 2}
.gbody{position:absolute;bottom:0;left:8px;width:114px;height:84px;background:#E5334B;border-radius:8px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.gbody::after,.glid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:20px;margin-left:-10px;background:#FFC53D}
.glid{position:absolute;bottom:80px;left:0;width:130px;height:34px;background:#C7283D;border-radius:8px;z-index:2;transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .6s}
.gbx.open{animation:none}
.gbx.open .glid{transform:translateY(-120px) rotate(-28deg);opacity:0}
.gbx.open .gbody{animation:gpulse .6s ease-out}
.rays{position:absolute;left:50%;margin-left:-130px;top:-40px;width:260px;height:260px;border-radius:50%;opacity:0;transition:opacity .5s;background:repeating-conic-gradient(rgba(255,197,61,.38) 0 10deg,transparent 10deg 20deg);animation:rot 6s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 70%);mask-image:radial-gradient(circle,#000 25%,transparent 70%)}
.rays.on{opacity:1}
.bsw{position:absolute;top:80px;left:50%;width:0;height:0;z-index:2}
.bs{position:absolute;width:8px;height:8px;border-radius:2px;animation:bsx 1s ease-out forwards}
#gprz{text-align:center;position:relative;z-index:3}
.gtier{font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.gamt{font-size:60px;font-weight:800;line-height:1.1;color:#FFE08A;text-shadow:0 2px 0 #CE9420,0 4px 0 #A06E15,0 10px 14px rgba(0,0,0,.5)}
.gmini{width:44px;height:44px;border-radius:12px;background:var(--soft);position:relative;flex:none!important;animation:float 3s ease-in-out infinite}
.gmini i{position:absolute;left:9px;right:9px;bottom:8px;height:18px;background:#E5334B;border-radius:3px}
.gmini::before{content:"";position:absolute;left:7px;right:7px;top:12px;height:8px;background:#C7283D;border-radius:3px;z-index:1}
.gmini::after{content:"";position:absolute;left:50%;margin-left:-3px;top:12px;bottom:8px;width:6px;background:#FFC53D;z-index:2}
.glow{animation:gl 1.4s ease-in-out infinite}
@keyframes gshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
@keyframes gpulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes bsx{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.4) rotate(280deg);opacity:0}}
@keyframes gl{0%,100%{box-shadow:0 0 0 0 rgba(229,51,75,0)}50%{box-shadow:0 0 0 7px rgba(229,51,75,.35)}}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--mute)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mute);margin-bottom:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div><p class="k" id="ovt">Ad playing</p><p class="mute">Demo ad. Your real ad network plays here.</p><p class="k" id="ovc">5</p></div></div>
<div id="toast"></div>
<nav id="nav"></nav>
<div id="splash"></div>
<div id="gift"></div>
<div id="mt"></div>
<script>
var CONFIG = {
  botName: "Alpha Earn",
  botUsername: "YourBotUsername",
  currency: "USDT",
  backgroundImage: "",
  pointsPerAd: 10,
  adsPerDay: 10,
  gamesPerGame: 6,
  levels: {
    easy: {label: "Easy", entry: 50,  win: 30, lose: 30, xoxMistake: 0.45, memPairs: 6,  memWin: 14, memDraw: 20, memFlip: 800, wfSize: 7,  wfWords: 4, wfTime: 120, wfAll: false},
    hard: {label: "Hard", entry: 100, win: 80, lose: 80, xoxMistake: 0.15, memPairs: 10, memWin: 16, memDraw: 24, memFlip: 450, wfSize: 10, wfWords: 8, wfTime: 75,  wfAll: true}
  },
  cooldownMin: 10,
  cooldownMax: 15,
  hardTargetWin: 0.35,
  gift: {minAds: 5, tiers: [[1,7,48],[8,15,40],[16,25,8],[26,40,3],[41,49,1]]},
  withdrawLocked: false,
  withdrawMsg: "Withdrawals are paused for a short time. Please check back soon.",
  maintenance: {on: false, msg: "We are updating the app. Please come back in a few minutes."},
  theme: {bg: "#070B1F", acc: "#E5334B", blue: "#7C9BFF", glow1: "#2F5BFF", glow2: "#E5334B"},
  adTasks: [
    {id: "a1", title: "Watch 4 ads", rewards: [15, 10, 7, 5]},
    {id: "a2", title: "Watch 3 ads", rewards: [12, 8, 5]}
  ],
  ecpmUsd: 2,
  userShare: 0.5,
  streakShape: [0.6, 0.7, 0.8, 0.9, 1, 1, 1],
  referralBonus: 100,
  pointsPerUsd: 10000,
  minWithdrawUsd: 1,
  payoutTime: "1-2 days",
  codes: [
    {code: "WELCOME50", coins: 50},
    {code: "ALPHA100", coins: 100, expires: "2027-12-31"}
  ],
  tasks: [
    {id: "t1", title: "Join partner channel", reward: 100, url: "https://t.me/telegram"},
    {id: "t2", title: "Follow us on X", reward: 60, url: "https://x.com"},
    {id: "t3", title: "Visit sponsor website", reward: 40, url: "https://example.com"}
  ]
};
var KEY = "leafearn_demo_v1", tab = "home", S;
function today(){return new Date().toDateString()}
function load(){
  try{S = JSON.parse(localStorage.getItem(KEY))}catch(e){S = null}
  if(!S) S = {pts:0, ads:0, day:today(), streak:0, bonusDay:"", done:{}, wd:[], uid:Math.floor(Math.random()*9e6+1e6)};
  if(S.day !== today()){S.day = today(); S.ads = 0; S.games = 0; S.gp = {}; S.at = {}; S.ta = 0}
  if(!S.fr){var nm = ["Alex","Sam","Maya","Leo","Nina","Omar","Zoe"], hr = [2,5,30,1,70,12,200], er = [120,60,40,200,15,90,10]; S.fr = nm.map(function(n, i){return {n:n, t:Date.now() - hr[i] * 36e5, e:er[i]}})}
  try{var tg = window.Telegram && Telegram.WebApp; if(tg){tg.ready(); tg.expand(); var u = tg.initDataUnsafe && tg.initDataUnsafe.user; if(u) S.uid = u.id}}catch(e){}
}
function save(){try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function usd(p){return (p / CONFIG.pointsPerUsd).toFixed(2)}
function toast(m){var t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(function(){t.style.display = "none"}, 2200)}
function add(n, m){sfx("coin"); S.pts += n; save(); render(); toast("+" + n + " coins" + (m ? " - " + m : ""))}
function resetStr(){var n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1), d = Math.floor((m - n) / 1000), p = function(x){return (x < 10 ? "0" : "") + x}; return p(Math.floor(d / 3600)) + ":" + p(Math.floor(d % 3600 / 60)) + ":" + p(d % 60)}
function rollDay(){if(S && S.day !== today()){S.day = today(); S.ads = 0; S.games = 0; S.gp = {}; S.at = {}; S.ta = 0; save(); render()}}
function tick(){cdTick(); rollDay(); var e = document.getElementById("rs"); if(e) e.textContent = resetStr()}
function cdLeft(){return Math.max(0, Math.ceil(((S.cd || 0) - Date.now()) / 1000))}
function cdTick(){
  var w = cdLeft(), b = document.querySelectorAll(".adbtn"), i;
  for(i = 0; i < b.length; i++){b[i].disabled = w > 0; b[i].textContent = w > 0 ? "Wait " + w + "s" : b[i].getAttribute("data-l")}
}
function adBtn(label, fn, cls, st){return '<button class="adbtn ' + (cls || "") + '" data-l="' + esc(label) + '" onclick="' + fn + '"' + (st ? ' style="' + st + '"' : "") + '>' + esc(label) + '</button>'}
function showAd(done){
  if(cdLeft() > 0) return;
  var ov = document.getElementById("ov"), c = document.getElementById("ovc"), n = 5;
  ov.style.display = "flex"; c.textContent = n;
  var h = setInterval(function(){n--; c.textContent = n; if(n <= 0){clearInterval(h); ov.style.display = "none"; S.cd = Date.now() + (CONFIG.cooldownMin + Math.random() * (CONFIG.cooldownMax - CONFIG.cooldownMin)) * 1000; S.ta = (S.ta || 0) + 1; save(); cdTick(); done()}}, 1000);
}
function watch(){
  if(S.ads >= CONFIG.adsPerDay){toast("Daily ad limit reached. Come back tomorrow."); return}
  showAd(function(){S.ads++; add(CONFIG.pointsPerAd)});
}
function adBudget(){return Math.floor(CONFIG.ecpmUsd / 1000 * CONFIG.userShare * CONFIG.pointsPerUsd + 1e-9)}
function tn(f, t, d, ty, v){if(!S.mute) tone(f, t, d, ty, v)}
function giftRoll(){
  var t = CONFIG.gift.tiers, tot = t.reduce(function(a, x){return a + x[2]}, 0), r = Math.random() * tot, i;
  for(i = 0; i < t.length; i++){r -= t[i][2]; if(r < 0) return {n: t[i][0] + Math.floor(Math.random() * (t[i][1] - t[i][0] + 1)), tier: i}}
  return {n: 1, tier: 0};
}

  if(!G || G.id !== "wf" || G.phase !== "play" || G.lock) return;
  var t = e.target.closest ? e.target.closest(".wfc") : null; if(!t) return;
  var i = +t.getAttribute("data-i"); G.bad = null; DR = {a:i, cur:i};
  wfPaint(G.sel >= 0 ? wfLine(G.sel, i) : [i]);
});
document.addEventListener("pointermove", function(e){
  if(!DR) return; var i = cellAt(e.clientX, e.clientY);
  if(i >= 0 && i !== DR.cur){DR.cur = i; wfPaint(wfLine(DR.a, i))}
});
document.addEventListener("pointerup", function(){
  if(!DR || !G){DR = null; return}
  var d = DR; DR = null;
  if(d.cur !== d.a){submitWF(wfLine(d.a, d.cur)); return}
  if(G.sel < 0){G.sel = d.a; sfx("tap"); render()}
  else if(G.sel === d.a){G.sel = -1; render()}
  else submitWF(wfLine(G.sel, d.a));
});
document.addEventListener("pointercancel", function(){DR = null; if(G && G.id === "wf") render()});
function claimGame(){
  if(G.claiming || cdLeft() > 0) return;
  G.claiming = true;
  var pts = LV().win;
  showAd(function(){G = null; add(pts, "game win")});
}
function confetti(){
  var c = ["#E5334B","#7C9BFF","#FFC53D","#ffffff"], h = "";
  for(var i = 0; i < 28; i++) h += '<i class="cf" style="left:' + Math.floor(Math.random() * 100) + '%;background:' + c[i % 4] + ';animation-delay:' + (Math.random() * .8).toFixed(2) + 's"></i>';
  return h;
}
function playView(){
  var L = LV(), t = {xox:"Tic-tac-toe (XOX)", wf:"Word find", mem:"Memory match"}[G.id];
  var h = '<div class="card"><div class="row" style="padding:0 0 4px;border:0"><div><b>' + t + '</b><span class="mute">' + L.label + ': win +' + L.win + ', lose -' + L.lose + ' coins</span></div>' + soundBtn() + '</div>';
  if(G.id === "xox"){
    h += '<p class="mute">You are X. Get three in a row.</p><div class="gr" style="grid-template-columns:repeat(3,1fr)">';
    G.b.forEach(function(v, i){
      var cl = "cell" + (i === G.lm && v ? " pop" : "") + (G.wl && G.wl.indexOf(i) >= 0 ? " wl" : "");
      h += '<button class="' + cl + '" onclick="xox(' + i + ')" style="color:' + (v === "X" ? "var(--blue)" : "var(--acc)") + '">' + v + '</button>';
    });
    h += '</div>';
  } else if(G.id === "wf"){
    var fc = {};
    G.words.forEach(function(w){if(w.f) w.cells.forEach(function(x){fc[x] = 1})});
    h += '<p class="mute">Swipe across a word, or tap its first and last letter. Time left: <b id="wt">' + G.left + 's</b></p><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
    G.words.forEach(function(w){h += '<span class="tag" style="' + (w.f ? "text-decoration:line-through;opacity:.55" : "") + '">' + w.w + '</span>'});
    h += '</div><div class="gr wfg" style="grid-template-columns:repeat(' + G.n + ',1fr);gap:4px;margin-top:0">';
    G.g.forEach(function(ch, x){
      var cl = "wfc" + (fc[x] ? " fnd" : "") + (G.sel === x ? " sl" : "") + (G.bad && G.bad.indexOf(x) >= 0 ? " shk" : "");
      h += '<button class="' + cl + '" data-i="' + x + '" onclick="if(!event.detail)wf(' + x + ')">' + ch + '</button>';
    });
    h += '</div>';
  } else {
    h += '<p class="mute">Find all ' + L.memPairs + ' pairs in ' + L.memWin + ' moves or fewer. Moves: ' + G.moves + '</p><div class="gr" style="grid-template-columns:repeat(' + (G.c.length > 16 ? 5 : 4) + ',1fr)">';
    G.c.forEach(function(v, i){
      var op = G.open.indexOf(i) >= 0, on = G.done[i] || op;
      var cl = "cell" + (i === G.fl && !G.lock && op ? " flip" : "") + (G.nm && G.nm.indexOf(i) >= 0 ? " mt" : "") + (G.lock && op ? " shk" : "");
      h += '<button class="' + cl + '" onclick="mem(' + i + ')" style="color:' + (G.done[i] ? "var(--blue)" : "var(--ink)") + ';font-size:' + (G.c.length > 16 ? 24 : 30) + 'px">' + (on ? v : "?") + '</button>';
    });
    h += '</div>';
  }
  return h + '</div>';
}
function resultView(){
  var r = G.res, L = LV(), t = {win:"You won", draw:"It's a draw", lose:"You lost this round"}[r];
  var amt = r === "win" ? "+" + L.win : r === "lose" ? "-" + L.lose : "0";
  var sub = r === "win" ? "Watch an ad to add your winnings" : r === "lose" ? "Coins were deducted from your balance" : "No coins won or lost";
  var btn = r === "win" ? adBtn("Watch ad to claim +" + L.win + " coins", "claimGame()", "p") : '<button class="p" onclick="G = null; render()">Back to games</button>';
  return '<div class="card rise" style="text-align:center;position:relative;overflow:hidden">' + (r === "win" ? confetti() : "") + '<p class="k">' + t + '</p><p class="mute">' + sub + '</p><div class="k pop" style="font-size:40px;color:' + (r === "lose" ? "var(--acc)" : "inherit") + '">' + amt + '</div><p class="mute">coins</p>' + btn + '</div>';
}
function setLevel(l){S.lvl = l; save(); sfx("tap"); render()}
function segBtns(lvl){return [["easy","e"],["hard","h"]].map(function(k){return '<button class="' + k[1] + (k[0] === lvl ? " on" : "") + '" onclick="setLevel(\'' + k[0] + '\')">' + CONFIG.levels[k[0]].label + '</button>'}).join("")}
function gamesView(){

  var lvl = curLvl(), L = adj(lvl); S.gp = S.gp || {};
  var list = [["xox","Tic-tac-toe (XOX)","Beat the computer in a classic 3x3 match."],["wf","Word find","Find " + L.wfWords + " hidden words in " + L.wfTime + " seconds."],["mem","Memory match","Find all " + L.memPairs + " pairs in " + L.memWin + " moves or fewer."]];
  var ic = {

    wf: '<span class="a" style="font-size:14px">W</span><span class="b" style="font-size:14px;color:var(--blue)">F</span>',
    mem: '<span class="fl">?</span>'
  };
  var h = '<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div class="seg" style="flex:1">' + segBtns(lvl) + '</div>' + soundBtn() + '</div><div class="note rise">' + L.label + ': you need ' + L.entry + ' coins to play. Win +' + L.win + ' coins, lose -' + L.lose + ' coins, a draw changes nothing. Watch an ad to start and another to claim a win. Each game can be played ' + CONFIG.gamesPerGame + ' times a day.</div>';
  list.forEach(function(g, n){
    var left = CONFIG.gamesPerGame - (S.gp[g[0]] || 0);
    var btn = left > 0 ? adBtn("Play", "startGame('" + g[0] + "')", "p") : '<span class="tag">Done today</span>';
    h += '<div class="card rise" style="animation-delay:' + (n * .12 + .1) + 's"><div class="row" style="padding:0;border:0"><div class="ic" style="flex:none;animation-delay:' + (n * .4) + 's">' + ic[g[0]] + '</div><div><b>' + g[1] + '</b><span class="mute">' + g[2] + '</span><span class="mute" style="display:block;font-size:12px">' + left + ' of ' + CONFIG.gamesPerGame + ' plays left today</span></div>' + btn + '</div></div>';
  });
  return h;
}
var lastPts = -1, LOGO = '<svg viewBox="0 0 36 36" role="img" aria-label="Alpha Earn logo"><rect width="36" height="36" rx="10" fill="#fff"/><path fill="#1740C9" fill-rule="evenodd" d="M18 7L28 29H23.5L21.5 24.5H14.5L12.5 29H8ZM16 20.5H20L18 15.5Z"/><circle cx="28.500" cy="9" r="3" fill="#D7263D"/></svg>';
function lum(h){var r = parseInt(h.substr(1, 2), 16), g = parseInt(h.substr(3, 2), 16), b = parseInt(h.substr(5, 2), 16); return (0.299 * r + 0.587 * g + 0.114 * b) / 255}
function applyTheme(){
  var t = CONFIG.theme || {}, st = document.documentElement.style;
  if(t.bg) st.setProperty("--bg", t.bg);
  if(t.acc){st.setProperty("--acc", t.acc); st.setProperty("--onacc", lum(t.acc) > 0.6 ? "#111111" : "#ffffff")}
  if(t.blue) st.setProperty("--blue", t.blue);
  if(t.glow1) st.setProperty("--blob1", t.glow1);
  if(t.glow2) st.setProperty("--blob2", t.glow2);
}
function applyMaint(){

  if(m.on){e.innerHTML = '<div class="spn"></div><h2 style="margin:0">Under maintenance</h2><p class="mute" style="max-width:300px;margin:0">' + esc(m.msg || "") + '</p>'; e.style.display = "flex"} else e.style.display = "none";
}
var LASTJ = "";
function pull(){
  try{fetch("settings.json", {cache:"no-store"}).then(function(x){return x.ok ? x.text() : null}).then(function(t){
    if(!t || t === LASTJ) return; LASTJ = t;
    var j = JSON.parse(t); Object.keys(j).forEach(function(k){CONFIG[k] = j[k]});
    applyTheme(); applyMaint(); render();
  }).catch(function(){})}catch(e){}
}
function render(){

function go(t){tab = t; render(); window.scrollTo(0, 0)}
if(CONFIG.backgroundImage) document.body.style.backgroundImage = "url(" + CONFIG.backgroundImage + ")";
load(); applyTheme(); applyMaint(); render(); setInterval(tick, 500);
pull(); setInterval(pull, 60000); document.addEventListener("visibilitychange", function(){if(!document.hidden) pull()});

sp.innerHTML = '<div class="ring"></div><div class="ring r2"></div><div class="slogo">' + LOGO + '</div><p class="sname">' + esc(CONFIG.botName) + '</p><div class="ld"><i></i></div>';

</script>
